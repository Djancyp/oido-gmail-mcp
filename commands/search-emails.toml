name = "search-emails"
description = "Search INBOX emails using Gmail search syntax (is:unread, from:, subject:, has:attachment, ...)."

prompt = """
Search for emails matching the Gmail query "{{query}}" using the search_emails tool.
Return at most {{count}} results.
"""

[parameters]
query = { type = "string", description = "Gmail search query, e.g. 'is:unread from:alice@example.com', 'has:attachment newer_than:7d', or plain text", required = true }
count = { type = "number", description = "Maximum number of results to return (default: 20)", default = 20 }
